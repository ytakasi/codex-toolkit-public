# Codex の管理側強制設定用の雛形。
# リポジトリへ sync するものではなく、個人環境または管理環境の requirements.toml に反映する。
#
# 既定の配置例:
# - Windows: %ProgramData%\OpenAI\Codex\requirements.toml
# - Linux / macOS: /etc/codex/requirements.toml
#
# 公式ドキュメント確認メモ:
# - deny_read は exact path または glob pattern を受ける。
# - "~" は HOME / USERPROFILE 相対として扱えるが、"./" から始まる相対パスは使わない。
# - native Windows では direct file tool には効くが、shell subprocess の read には効かない。

[permissions.filesystem]
deny_read = [
  "**/.env",
  "**/.env.local",
  "**/.env.development",
  "**/.env.production",
  "**/.env.staging",
  "**/.env.test",
  "**/.env.*.local",
  "**/id_rsa",
  "**/id_ed25519",
  "**/credentials.json",
  "**/secrets.json",
  "**/*.pem",
  "**/*.pfx",
  "**/*.p12",
  "**/*.key",
  "**/service-account*.json",
]
