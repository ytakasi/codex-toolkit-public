name: REPLACE_ME Scheduled Job

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: replace-me-scheduled-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RUN_MODE: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Migrate database
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::notice::MIGRATION_DATABASE_URL is not configured; skipping migration step."
            exit 0
          fi

          DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm db:migrate

      - name: Run job
        run: pnpm start

      # 任意の失敗通知:
      # scheduled-batch-hardening skill の
      # assets/github-actions-failure-notify-step.yml から標準stepを貼り付け、
      # APP_NAME / JOB_NAME をこのリポジトリ用に設定する。
